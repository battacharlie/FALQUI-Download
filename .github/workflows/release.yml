# Every push that changes the app files republishes them as the "latest"
# release, so the links in the README (and on the website) always serve the
# newest version.
name: release
on:
  push:
    branches: [main]
    paths: ['FALQUI-*.apk', 'FALQUI.ipa', 'FALQUI-Setup.exe', 'FALQUI-Windows.zip', 'RELEASE_NOTES.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="FALQUI For NDI 2.0"
          gh release view latest >/dev/null 2>&1 || gh release create latest --latest --title "$title" --notes-file RELEASE_NOTES.md
          gh release edit latest --title "$title" --notes-file RELEASE_NOTES.md
          # Upload the files in the repo; a file removed from the repo is
          # withdrawn from the release too.
          for f in FALQUI-arm64.apk FALQUI-armv7.apk FALQUI.ipa FALQUI-Setup.exe FALQUI-Windows.zip; do
            if [ -f "$f" ]; then
              gh release upload latest "$f" --clobber
            else
              gh release delete-asset latest "$f" --yes 2>/dev/null || true
            fi
          done
